name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 本插件的运行时依赖为空，devDependencies 只有 typescript / tsdown /
      # @types/node，用 npm 即可。上游曾用 pnpm + 一份 pnpm-workspace.yaml，
      # 但那份 workspace 声明的 28 个 @deepseek-ai/* overrides 全是上游 DSH
      # 项目的依赖，本仓库一个都不用——只会让 CI 在安装阶段就失败。
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      # 构建产物 lib/ 是入库的（插件入口是 lib/index.js，见 package.json 的
      # tianshu.entry），这里校验重新构建后与入库版本一致——防止源码改了却
      # 忘了提交新构建，那会让安装方拿到过期的插件。
      #
      # 只比内容，不比权限位：tsdown 在 POSIX 上会给 cli.js 加执行位，于是
      # 同一份内容在 Linux 上重建会变成 100755，与仓库里的 100644 不等——
      # `git diff` 因此报「0 insertions, 0 deletions」的假差异。
      # 用 --ignore-submodules 无关，改用 diff 的输出内容是否为空来判定。
      - name: Verify build output is committed
        shell: bash
        run: |
          changes="$(git diff --stat -- lib/ | tail -n 1)"
          if [ -n "$(git diff --numstat -- lib/ | awk '$1 != 0 || $2 != 0')" ]; then
            echo "::error::lib/ 与源码不同步——请运行 npm run build 并提交结果"
            git --no-pager diff --stat lib/
            exit 1
          fi
          echo "lib/ 与源码一致（${changes:-无变化}）"

      - name: Verify package contents
        run: npm pack --dry-run
